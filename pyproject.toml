[project]
name = "ds-compiler"
version = "0.1.0"
description = "Compiler for a declarative, agent-operated design system: JSON spec -> Django app (tags, templates, CSS)"
readme = "README.md"
authors = [
    { name = "Sondre Engebråten", email = "sondre.engebraten@dig.oslo.kommune.no" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "jsonschema>=4.26.0",
]

[project.scripts]
ds-compile = "ds_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
